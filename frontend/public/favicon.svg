<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
    <defs>
        <radialGradient id="petalGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#F8C8DC;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E8A0BF;stop-opacity:1" />
        </radialGradient>
        <filter id="softGlow" x="-0.5" y="-0.5" width="2" height="2">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Crocheted Flower Petals -->
    <g transform="translate(50 50)" filter="url(#softGlow)">
        <path d="M 0 -40 C 20 -40, 35 -20, 35 0 C 35 20, 20 40, 0 40 C -20 40, -35 20, -35 0 C -35 -20, -20 -40, 0 -40 Z" fill="url(#petalGradient)" transform="rotate(0)" opacity="0.9"/>
        <path d="M 0 -40 C 20 -40, 35 -20, 35 0 C 35 20, 20 40, 0 40 C -20 40, -35 20, -35 0 C -35 -20, -20 -40, 0 -40 Z" fill="url(#petalGradient)" transform="rotate(72)" opacity="0.9"/>
        <path d="M 0 -40 C 20 -40, 35 -20, 35 0 C 35 20, 20 40, 0 40 C -20 40, -35 20, -35 0 C -35 -20, -20 -40, 0 -40 Z" fill="url(#petalGradient)" transform="rotate(144)" opacity="0.9"/>
        <path d="M 0 -40 C 20 -40, 35 -20, 35 0 C 35 20, 20 40, 0 40 C -20 40, -35 20, -35 0 C -35 -20, -20 -40, 0 -40 Z" fill="url(#petalGradient)" transform="rotate(216)" opacity="0.9"/>
        <path d="M 0 -40 C 20 -40, 35 -20, 35 0 C 35 20, 20 40, 0 40 C -20 40, -35 20, -35 0 C -35 -20, -20 -40, 0 -40 Z" fill="url(#petalGradient)" transform="rotate(288)" opacity="0.9"/>
    </g>

    <!-- Center of the flower -->
    <circle cx="50" cy="50" r="12" fill="#F0E6F2"/>
    <circle cx="50" cy="50" r="8" fill="#D8BFD8"/>

    <!-- Subtle yarn texture on petals -->
    <g transform="translate(50 50)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5">
        <path d="M 0 -35 C 15 -35, 25 -20, 25 0" transform="rotate(0)"/>
        <path d="M 0 -35 C 15 -35, 25 -20, 25 0" transform="rotate(72)"/>
        <path d="M 0 -35 C 15 -35, 25 -20, 25 0" transform="rotate(144)"/>
        <path d="M 0 -35 C 15 -35, 25 -20, 25 0" transform="rotate(216)"/>
        <path d="M 0 -35 C 15 -35, 25 -20, 25 0" transform="rotate(288)"/>
    </g>
</svg>