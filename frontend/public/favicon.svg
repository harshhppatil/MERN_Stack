<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
    <!-- Background -->
    <rect width="100" height="100" rx="20" fill="#1a1a1a"/>

    <!-- Film Reel Icon -->
    <g transform="translate(50 50) scale(0.9)">
        <defs>
            <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#FF416C;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#FF4B2B;stop-opacity:1" />
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <circle cx="0" cy="0" r="40" fill="url(#redGradient)" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="15" fill="#1a1a1a"/>

        <!-- Reel holes -->
        <g fill="#1a1a1a" opacity="0.8">
            <rect x="-35" y="-5" width="20" height="10" rx="5" transform="rotate(0 0 0)"/>
            <rect x="-35" y="-5" width="20" height="10" rx="5" transform="rotate(60 0 0)"/>
            <rect x="-35" y="-5" width="20" height="10" rx="5" transform="rotate(120 0 0)"/>
            <rect x="-35" y="-5" width="20" height="10" rx="5" transform="rotate(180 0 0)"/>
            <rect x="-35" y="-5" width="20" height="10" rx="5" transform="rotate(240 0 0)"/>
            <rect x="-35" y="-5" width="20" height="10" rx="5" transform="rotate(300 0 0)"/>
        </g>
    </g>
</svg>